function render(){
 const timeline=$('timeline');timeline.replaceChildren();
 for(const month of [7,8,9,10,11]){
  if((month===11&&!unlocked)||(unlocked&&month<10))continue;
  const section=document.createElement('section');section.className='timeline-month';section.id='month-'+month;
  const title=document.createElement('h3');title.textContent=monthNames[month];title.tabIndex=-1;section.append(title);

   const date=document.createElement('span');date.className='timeline-date';date.textContent=memory.date;
   const interactive=Boolean(memoryQuestions[memory.date])||['10月17日','11月22日'].includes(memory.date);const text=document.createElement(interactive?'button':'p');if(interactive){text.type='button';text.addEventListener('click',()=>openMemoryQuestion(memory))}text.className=interactive?'memory-sentence':'memory-static';text.textContent=memory.text;item.append(date,text);
   if(memory.date==='11月22日'){
    item.classList.add('special-entry');date.textContent='11.22';
    const button=document.createElement('button');button.className='text-button';button.textContent='next →';button.addEventListener('click',openConfession);item.append(button);list.append(item);return;
   }
   if(memory.date==='10月17日'){
    item.classList.add('special-entry');date.textContent='10.17';text.textContent=memory.text;
    const button=document.createElement('button');button.className='text-button';button.textContent='next->';button.addEventListener('click',openSpecial);item.append(button);list.append(item);return;
   }
   const index=memories.indexOf(memory);const number=String(index+1).padStart(2,'0');
   const sources=album[memory.date] || (memory.photo ? [memory.photo] : []);
   sources.forEach((src,mediaIndex)=>{
    const window=document.createElement('div');window.className='photo-window';
    const figure=document.createElement('figure');figure.className='memory-photo';figure.dataset.direction=(index+mediaIndex)%2===0?'1':'-1';
    if(src){
     const isVideo=/\.mp4$/i.test(src);const media=document.createElement(isVideo?'video':'img');
     if(isVideo){media.controls=true;media.playsInline=true;media.preload='metadata';media.setAttribute('aria-label',memory.date+'的视频')}

function openMemoryQuestion(memory,insideSpecial=false){

 activeMemory=memory;activeQuestion=memoryQuestions[memory.date];$('quiz-title').textContent=memory.date;

special.innerHTML='<button class="back" id="special-back">← 回到时间线</button><h2 tabindex="-1">10.17</h2><button type="button" id="special-question" class="special-subtitle memory-sentence">这天Batu Ferringhi下雨walau 没有日落 我的打卡板不见了</button><div id="special-memories"></div><button class="text-button" id="special-next">next</button>';
$('reading').after(special);
$('special-question').addEventListener('click',()=>openMemoryQuestion(memories.find(m=>m.date==='10月17日'),true));
function openSpecial(){
 document.querySelectorAll('video').forEach(v=>v.pause());
 const content=$('special-memories');content.replaceChildren();
 const files=['photos/1017(1).jpeg','photos/1017.jpeg'];
 files.forEach((src,i)=>{const img=document.createElement('img');img.src=src;img.alt=i===0?'10月17日，海边的你':'10月17日，海边的火舞';content.append(img);});
 $('reading').hidden=true;special.hidden=false;special.querySelector('h2').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
}
function returnToTimeline(continueStory){
 unlocked=continueStory;special.hidden=true;$('reading').hidden=false;render();
 syncChapters();
 const target=$('memory-'+(continueStory?11:10));target.tabIndex=-1;target.focus({preventScroll:true});target.scrollIntoView({behavior:'instant',block:'start'});schedulePhotos();
}
$('special-back').addEventListener('click',()=>returnToTimeline(false));
$('special-next').addEventListener('click',()=>returnToTimeline(true));
const earlier=document.createElement('button');earlier.className='back';earlier.textContent='10.17之前';earlier.hidden=true;
$('reading').querySelector('.reading-top').after(earlier);
earlier.addEventListener('click',()=>returnToTimeline(false));
function syncChapters(){
 document.querySelectorAll('a.chapter').forEach(link=>{const month=Number(link.getAttribute('href').split('-')[1]);link.hidden=unlocked?month<10:month===11});
 earlier.hidden=!unlocked;
}
syncChapters();
const confession=document.createElement('section');confession.id='confession';confession.className='stationery special-day';confession.hidden=true;
confession.innerHTML=`<button class="back" id="confession-back">← 回到我们的时间线</button>
<h2 tabindex="-1">11.22</h2>
<div class="confession-copy"><p>我有很多很多话想跟你讲！<br>我们相处的时间也已经不算很短了<br>虽然没有吵过架<br>但是也已经看到要磨合的地方料<br>我觉得我们的目标都一样<br>不想要随便开始一段关系<br>也希望可以走长长久久<br>所以今天我讲的不会全部都是好话<br>我发现到我的不足<br>然后也有我觉得不安全感的地方想跟你讲</p><p>你先选 我再来讲！</p><h3 id="confession-question" hidden>愿意和我在一起吗？！😳</h3></div>
<button class="text-button" id="reveal-choices" aria-expanded="false" aria-controls="confession-choices">准备好了吗 要好好选pls 只能选一次罢了</button>
<div class="responses" id="confession-choices" aria-label="你的回应" hidden><button class="response" id="say-yes" aria-pressed="false">愿意 ❤️</button><button class="response" id="think-about-it" aria-pressed="false">我还没想好</button></div>
<div class="confession-hearts" aria-hidden="true" hidden><span>♡</span><span>♡</span><span>♡</span></div>
<p class="answer" id="confession-answer" role="status" aria-live="polite"></p>
<button class="text-button" id="confession-next" hidden>下一页 →</button>
`;
special.after(confession);
const inPerson=document.createElement('section');inPerson.id='in-person';inPerson.className='stationery special-day';inPerson.hidden=true;
inPerson.innerHTML=`<button class="back" id="in-person-back">← 回到上一页</button><div class="confession-copy"><h3 tabindex="-1">ok可以跟我讲话了</h3><p>我要跟你讲多多</p></div>`;
confession.after(inPerson);
$('confession-next').addEventListener('click',()=>{if($('say-yes').getAttribute('aria-pressed')!=='true')return;confession.hidden=true;inPerson.hidden=false;inPerson.querySelector('h3').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})});
$('in-person-back').addEventListener('click',()=>{inPerson.hidden=true;confession.hidden=false;$('confession-next').focus({preventScroll:true});$('confession-next').scrollIntoView({behavior:'instant',block:'center'})});

function openConfession(){document.querySelectorAll('video').forEach(v=>v.pause());$('reading').hidden=true;confession.hidden=false;confession.querySelector('h2').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
$('confession-back').addEventListener('click',()=>{confession.hidden=true;$('reading').hidden=false;const target=$('memory-22');target.tabIndex=-1;target.focus({preventScroll:true});target.scrollIntoView({behavior:'instant',block:'start'});schedulePhotos()});
const answerKey='our-story-1122-answer-v1';
$('reset-answer').addEventListener('click',()=>{
 if($('cover').hidden||opening)return;
 try{
  localStorage.removeItem(answerKey);
  savedAnswer=null;
  $('confession-question').hidden=true;$('reveal-choices').hidden=false;$('reveal-choices').setAttribute('aria-expanded','false');$('confession-choices').hidden=true;
  for(const id of ['say-yes','think-about-it']){const button=$(id);button.disabled=false;button.hidden=false;button.setAttribute('aria-pressed','false')}
  $('confession-answer').textContent='';$('confession-next').hidden=true;confession.querySelector('.confession-hearts').hidden=true;
  alert('已重置，可以重新选择。');
 }catch(error){alert('重置失败，请检查浏览器是否允许本地存储。')}
});

let savedAnswer=null;
function readAnswer(){const value=localStorage.getItem(answerKey);return ['yes','think'].includes(value)?value:null}
function showSavedAnswer(){
 if(!savedAnswer)return;
 const yes=savedAnswer==='yes';
 $('confession-question').hidden=false;$('reveal-choices').hidden=true;$('confession-choices').hidden=false;
 $('say-yes').disabled=true;$('think-about-it').disabled=true;
 $('say-yes').hidden=!yes;$('think-about-it').hidden=yes;
 $('say-yes').setAttribute('aria-pressed',String(yes));$('think-about-it').setAttribute('aria-pressed',String(!yes));
 $('confession-answer').textContent=yes?'YAY ❤️':'so sad EMO';
 confession.querySelector('.confession-hearts').hidden=!yes;$('confession-next').hidden=!yes;
}
try{
 const resetKey='our-story-local-reset-20261120-1';
 if(location.protocol==='file:' && localStorage.getItem(resetKey)!=='done'){
  localStorage.removeItem(answerKey);localStorage.setItem(resetKey,'done');
 }
 savedAnswer=readAnswer();showSavedAnswer()
}catch(error){$('confession-answer').textContent='浏览器暂时无法保存选择，请允许本地存储后再继续。'}
$('reveal-choices').addEventListener('click',()=>{$('confession-question').hidden=false;$('confession-answer').textContent='真的真的只能选一次 不要乱按';$('reveal-choices').hidden=true;$('reveal-choices').setAttribute('aria-expanded','true');$('confession-choices').hidden=false;$('say-yes').focus()});
function answerConfession(yes){
 try{
  savedAnswer=readAnswer()||savedAnswer;
  if(savedAnswer){showSavedAnswer();return}
  const choice=yes?'yes':'think';localStorage.setItem(answerKey,choice);
  if(readAnswer()!==choice)throw Error('Could not save');
  savedAnswer=choice;showSavedAnswer();
 }catch(error){$('confession-answer').textContent='这次选择还没有保存。请允许浏览器使用本地存储，再试一次。'}
}
window.addEventListener('storage',event=>{if(event.key===answerKey){try{savedAnswer=readAnswer()||savedAnswer;showSavedAnswer()}catch(error){}}});
$('say-yes').addEventListener('click',()=>answerConfession(true));$('think-about-it').addEventListener('click',()=>answerConfession(false));
let scrollFrame=0;
function updatePhotos(){
 scrollFrame=0;if($('reading').hidden)return;
 document.querySelectorAll('.memory-photo').forEach(photo=>{
  const top=photo.parentElement.getBoundingClientRect().top;
  const progress=reduced.matches?1:Math.max(0,Math.min(1,(innerHeight*.96-top)/(innerHeight*.42)));
  const eased=1-Math.pow(1-progress,3);
  photo.style.setProperty('--slide',((1-eased)*100*Number(photo.dataset.direction))+'px');
  photo.style.setProperty('--photo-opacity',String(.15+.85*eased));
 });
}
function schedulePhotos(){if(!scrollFrame)scrollFrame=requestAnimationFrame(updatePhotos)}
window.addEventListener('scroll',schedulePhotos,{passive:true});window.addEventListener('resize',schedulePhotos);
reduced.addEventListener('change',schedulePhotos);
const backgroundMusic=$('background-music'),musicControl=$('music-control');
function syncMusicControl(){const playing=!backgroundMusic.paused&&!backgroundMusic.ended;musicControl.dataset.playing=String(playing);musicControl.setAttribute('aria-pressed',String(playing));musicControl.setAttribute('aria-label',playing?'暂停音乐':'播放音乐')}
async function startMusic(){try{await backgroundMusic.play()}catch(error){}syncMusicControl()}
backgroundMusic.addEventListener('play',syncMusicControl);backgroundMusic.addEventListener('pause',syncMusicControl);backgroundMusic.addEventListener('ended',syncMusicControl);
musicControl.addEventListener('click',()=>backgroundMusic.paused?startMusic():backgroundMusic.pause());
function openLetter(){if(opening)return;startMusic();opening=true;$('reset-answer').disabled=true;$('cover').classList.add('opening');$('seal').setAttribute('aria-expanded','true');timer=setTimeout(()=>{$('cover').hidden=true;$('reading').hidden=false;render();schedulePhotos();$('page-content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});opening=false},reduced.matches?0:850)}
$('seal').addEventListener('click',openLetter);
$('close-letter').addEventListener('click',()=>{document.querySelectorAll('video').forEach(video=>video.pause());clearTimeout(timer);opening=false;$('reading').hidden=true;$('cover').hidden=false;$('reset-answer').disabled=false;$('cover').classList.remove('opening');$('seal').setAttribute('aria-expanded','false');$('seal').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})});
document.querySelectorAll('.chapter').forEach(link=>link.addEventListener('click',event=>{
 event.preventDefault();const target=document.querySelector(link.getAttribute('href'));if(!target)return;
 target.querySelector('h3').focus({preventScroll:true});target.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'start'});
}));
</script>
